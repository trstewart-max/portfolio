<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <h1>Meta</h1>

  <p>This page includes stats about the code of this website.</p>

  <div class="commit-filter">
    <label>
      Show commits until:
      <input
        id="commit-progress"
        type="range"
        min="0"
        max="100"
        value="100"
      />
    </label>

    <time id="commit-time"></time>
  </div>

 <div id="stats"></div>

<h2>Files by lines of code</h2>
<dl id="files"></dl>

<div id="scrolly-1">
  <div id="scatter-story"></div>

  <div id="scatter-plot">
    <h2>Commits by time of day</h2>
    <div id="chart"></div>
  </div>
</div>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a href="" id="commit-link" target="_blank"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Time</dt>
    <dd id="commit-time-tooltip"></dd>

    <dt>Lines</dt>
    <dd id="commit-lines"></dd>
  </dl>

  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
